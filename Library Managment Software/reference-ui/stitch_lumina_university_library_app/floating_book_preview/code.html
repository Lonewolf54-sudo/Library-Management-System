<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .book-container {
            perspective: 1500px;
        }

        .book-3d {
            width: 280px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(-25deg) rotateX(5deg);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .book-3d:hover {
            transform: rotateY(-15deg) rotateX(0deg) translateY(-10px);
        }

        .book-cover {
            position: absolute;
            width: 280px;
            height: 400px;
            background: #1b1b1d;
            transform: translateZ(20px);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            border-radius: 2px 8px 8px 2px;
        }

        .book-spine {
            position: absolute;
            width: 40px;
            height: 400px;
            background: #151517;
            transform: rotateY(-90deg) translateZ(20px);
            left: 0;
            border-radius: 4px 0 0 4px;
        }

        .book-pages {
            position: absolute;
            width: 270px;
            height: 390px;
            background: #fdfaf3; /* Parchment white */
            transform: translateZ(0px) translateX(10px) translateY(5px);
            box-shadow: inset 2px 0 5px rgba(0,0,0,0.1);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, #e4e2e4 2px, #e4e2e4 3px);
        }

        .gilt-edge {
            border: 1px solid #d4af37;
        }

        .blur-overlay {
            backdrop-filter: blur(12px) brightness(0.85);
        }

        .floating-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(-25deg); }
            50% { transform: translateY(-15px) rotateY(-20deg); }
        }

        .spine-label {
            writing-mode: vertical-rl;

<!-- Bottom Navigation Shell (Filter Applied: Transactional Detail Screen - Navigation Suppressed as per instructions, however context suggests user might want to return. Using a floating 'back' logic instead) -->
<script>
        // Micro-interaction for the book movement
        const book = document.querySelector('.book-3d');
        const container = document.body;

        container.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            // Limit the rotation
            const rotateY = -25 - (xAxis * 0.5);
            const rotateX = 5 + (yAxis * 0.5);
            
            book.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            book.style.transform = `rotateY(-25deg) rotateX(5deg)`;
        });
    </script>
