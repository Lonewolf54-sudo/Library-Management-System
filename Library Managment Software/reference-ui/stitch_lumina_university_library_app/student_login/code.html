<body class="bg-background text-on-background font-body-lg overflow-hidden h-screen flex flex-col">
<!-- Background Image Layer -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center scale-105 filter brightness-95" data-alt="A breathtaking, cinematic view of a majestic university library hall. Sunlight streams through tall, arched windows, illuminating dust motes dancing in the air above long, polished oak tables. The atmosphere is serene and scholarly, featuring rows of classical leather-bound books on towering mahogany shelves. The style is high-fidelity and minimalist, with a warm, inviting light-mode color palette of creams, soft golds, and deep wood tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCZSBaZPSRQYmSJieUOL1CVrtIpwpD4eXIgOU5_nSsvrodmxKeIiRUbpyPEPrV7rtpLRIZe-clCSzay73vHGEG2wP0ERGAQQ7wfsvFoW9-HaR3zVpY7T_C9UVd1Csxol43eA1ioHtCO7hBeqHT5SuTG8OAwm2XKdG--seQIQvijjzS1b8Mrg4Yh7M_Y45ZAswf4vMBVxMoorMSmZB8e2dyxNodmuGQjV6FHYqEVeRDL-9le94lXfhu-UiKs3Vw-nGNOj8DZBgGZBWA')">
</div>
<!-- Gradient Overlay for legibility -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-surface/40 to-surface"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-container-padding">
<div class="w-full max-w-[420px] space-y-stack-lg">
<!-- Branding Header -->
<header class="text-center space-y-4">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-full mb-base shadow-lg">
<span class="material-symbols-outlined text-on-primary text-[32px]">account_balance</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Athenaeum Digital</h1>
<p class="font-body-sm text-on-surface-variant tracking-wide">University Intellectual Archive</p>
</header>
<!-- Login Card -->
<section class="paper-grain glass-blur bg-surface-container-lowest/80 border border-white/40 p-8 rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.06)] animate-in fade-in slide-in-from-bottom-4 duration-700">
<form class="space-y-6" id="loginForm">
<!-- Identification Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1 uppercase" for="identifier">Registration / Email</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary transition-all placeholder:text-outline-variant" id="identifier" placeholder="24-STUD-8902" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<button class="text-secondary font-label-caps text-label-caps hover:underline transition-all" id="togglePassword" type="button">Show password</button>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant rounded-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Utilities -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-3 cursor-pointer group">
<div class="relative">
<input class="peer hidden" type="checkbox"/>
<div class="w-5 h-5 border-2 border-outline-variant rounded peer-checked:bg-secondary peer-checked:border-secondary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-white hidden peer-checked:block">check</span>
</div>
</div>
<span class="font-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-secondary hover:text-secondary-fixed-variant transition-colors underline decoration-secondary/30 underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- CTA -->
<button class="w-full py-5 bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-xl hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center space-x-3" type="submit">
<span>Login to Archive</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</section>
<!-- Footer Section -->
<footer class="text-center pt-base">
<a class="inline-flex items-center space-x-2 font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">help_outline</span>
<span>Need Help? Contact Registrar</span>
</a>
</footer>
</div>
</main>
<!-- Reading Progress Bar Decoration (Top) -->
<div class="fixed top-0 left-0 w-full h-[2px] bg-secondary/20 z-50">
<div class="h-full bg-secondary w-0 transition-all duration-700" id="loadingBar"></div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const loginForm = document.getElementById('loginForm');
            const loadingBar = document.getElementById('loadingBar');

            // Password Toggle Logic
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.textContent = isPassword ? 'Hide password' : 'Show password';
            });

            // Subtle Loading Animation on Submit
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = loginForm.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span>';
                btn.classList.add('opacity-80', 'cursor-not-allowed');
                
                let width = 0;
                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        // Mock redirect feel
                        window.location.reload(); 
                    } else {
                        width += 5;
                        loadingBar.style.width = width + '%';
                    }
                }, 50);
            });

            // Entry animation trigger
            setTimeout(() => {
                loadingBar.style.width = '20%';
                setTimeout(() => { loadingBar.style.width = '0%'; }, 500);
            }, 300);
        });
    </script>
</body></html>
